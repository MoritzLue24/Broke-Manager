services:
    nginx:
        image: nginx:1.29.8-alpine
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            api:
                condition: service_healthy
        networks:
            - BrokeManager_network

    api:
        build:
            context: ./Api
            target: build
        image: api:latest
        restart: unless-stopped
        depends_on:
            mssql:
                condition: service_healthy
        volumes:
            - ./Api:/Api
        command: dotnet watch run --non-interactive --urls http://0.0.0.0:5033
        env_file: .env
        environment:
            - ConnectionStrings__DefaultConnection=Server="${DB_CONNECTION_STRING}"
            - ASPNETCORE_ENVIRONMENT=Development
            - DOTNET_USE_POLLING_FILE_WATCHER=1
            - ASPNETCORE_HTTP_PORTS=5033
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5033/health"] 
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks:
            - BrokeManager_network
        

    migrate:
        image: api:latest
        restart: no
        depends_on:
            mssql:
                condition: service_healthy
        env_file: .env
        profiles:
            - migrate
        command: ["dotnet", "Api.dll", "--migrate"]
        environment:
            - ConnectionStrings__DefaultConnection=Server="${DB_CONNECTION_STRING}"
        networks:
            - BrokeManager_network

    mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        restart: unless-stopped
        ports:
            - "1433:1433"
        volumes:
            - mssql-data:/var/opt/mssql
        env_file: .env
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
        healthcheck:
            test: [
                "CMD", "/opt/mssql-tools18/bin/sqlcmd", 
                "-S", "localhost", 
                "-U", "sa", 
                "-P", "${MSSQL_SA_PASSWORD}", 
                "-C", 
                "-Q", "SELECT 1"
            ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        networks:
            - BrokeManager_network

networks:
    BrokeManager_network:
        driver: bridge

volumes:
    mssql-data:
    mssql-dev-data: