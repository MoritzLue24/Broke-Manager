info:
  name: create-category
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/categories"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Haushalt",
        "keywords": ["Ikea"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
