info:
  name: update-me
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/users/me"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "myemail@e.de"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
