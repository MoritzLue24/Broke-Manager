info:
  name: summary
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/analytics/summary?range=custom&from=2026-01-01"
  params:
    - name: range
      value: custom
      type: query
    - name: from
      value: 2026-01-01
      type: query
    - name: to
      value: 2029-01-01
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
